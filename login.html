<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaGo - Iniciar sesión</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <span>Pharma</span><strong>Go</strong>
        </div>
        <p class="subtitulo">Consulta inteligente de medicamentos</p>

        <div class="login-box">
            <div id="vistaLogin">
            <h1>Iniciar sesión</h1>
            <p class="descripcion">Selecciona tu tipo de cuenta para continuar</p>

            <div class="roles">
                <button type="button" class="rol activo" data-rol="Paciente">
                    <span class="icono">👤</span>
                    <span>Paciente</span>
                </button>
                <button type="button" class="rol" data-rol="Farmacéutico">
                    <span class="icono">💊</span>
                    <span>Farmacéutico</span>
                </button>
                <button type="button" class="rol" data-rol="Administrador">
                    <span class="icono">⚙️</span>
                    <span>Administrador</span>
                </button>
            </div>

            <div class="rol-seleccionado">
                <span id="iconoRol">👤</span>
                <span id="textoRol">Ingresando como Paciente</span>
            </div>

            <form id="loginForm" novalidate>
                <div class="campo">
                    <label for="usuario">Correo electrónico</label>
                    <input type="text" id="usuario" placeholder="correo@ejemplo.com" autocomplete="email">
                    <small class="error-campo" id="errorUsuario"></small>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="password" placeholder="Ingresa tu contraseña">
                        <button type="button" id="mostrarPassword" class="ver-password">👁</button>
                    </div>
                    <small class="error-campo" id="errorPassword"></small>
                </div>

                <div class="opciones">
                    <label class="recordar">
                        <input type="checkbox" id="recordar">
                        Recordarme
                    </label>
                </div>

                <button type="submit" class="btn-login">Iniciar sesión</button>
            </form>

            <div id="mensaje" class="mensaje"></div>
            <div class="registro">
                <p>¿No tienes una cuenta?</p>
                <button type="button" id="irRegistro" class="btn-registro">Registrarse</button>
            </div>
            </div>

            <div id="vistaRegistro" hidden>
                <h1>Crear cuenta</h1>
                <p class="descripcion">Regístrate como paciente para consultar medicamentos</p>

                <form id="registroForm" novalidate>
                <div class="campo">
                    <label for="regNombres">Nombres</label>
                    <input type="text" id="regNombres" placeholder="Tus nombres" maxlength="50" autocomplete="given-name">
                    <small class="error-campo" id="errorRegNombres"></small>
                </div>
                <div class="campo">
                    <label for="regApellidos">Apellidos</label>
                    <input type="text" id="regApellidos" placeholder="Tus apellidos" maxlength="50" autocomplete="family-name">
                    <small class="error-campo" id="errorRegApellidos"></small>
                </div>
                <div class="campo">
                    <label for="regCorreo">Correo electrónico</label>
                    <input type="text" id="regCorreo" placeholder="correo@ejemplo.com" maxlength="100" autocomplete="email">
                    <small class="error-campo" id="errorRegCorreo"></small>
                </div>
                <div class="campo">
                    <label for="regPassword">Contraseña</label>
                    <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" maxlength="255" autocomplete="new-password">
                    <small class="error-campo" id="errorRegPassword"></small>
                </div>
                <div class="campo">
                    <label for="regConfirmar">Confirmar contraseña</label>
                    <input type="password" id="regConfirmar" placeholder="Repite tu contraseña" maxlength="255" autocomplete="new-password">
                    <small class="error-campo" id="errorRegConfirmar"></small>
                </div>

                    <button type="submit" class="btn-login">Crear cuenta</button>
                </form>

                <div id="mensajeRegistro" class="mensaje"></div>

                <div class="registro">
                    <p>¿Ya tienes una cuenta? <a href="#" id="irLogin">Iniciar sesión</a></p>
                </div>
            </div>


            <a href="index.html" class="volver">Volver al inicio</a>
        </div>
    </div>

    <script src="js/services/storageService.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/modelo.js"></script>
    <script src="js/auth/sesion.js"></script>
    <script src="js/auth/login.js"></script>
    <script src="js/auth/registro.js"></script>
</body>
</html>
